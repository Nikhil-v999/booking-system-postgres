services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fdp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test123
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    env_file:
      - .env
    ports:
      - "8001:8001"

volumes:
  pgdata: